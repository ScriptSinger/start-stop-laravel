; Пересчёт посадочных по авто (car-landings:refresh) и прогрев кеша каталога
; занимают около 180 МБ — больше стандартных 128 МБ. В проде то же значение
; задаёт php-production.ini; здесь оно нужно локальному php, scheduler и worker.
memory_limit=512M

; OPcache
; validate_timestamps=1 — локальная разработка: PHP сам замечает изменения файлов,
; перезапускать php-контейнер после правки кода не нужно. В проде (когда дойдёт
; до деплоя рядом с другими вашими проектами) стоит переключить на 0, как в
; fridge-service, раз там пересборка контейнера и так сбрасывает кэш.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
