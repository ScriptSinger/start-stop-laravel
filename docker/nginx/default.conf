server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 200M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json text/xml text/html;
    gzip_min_length 256;
    gzip_vary on;

    # Хешированные ассеты сборки Vite (/build/*)
    location ~* ^/build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Прочая статика (шрифты, иконки, картинки темы unishop2, image/catalog/...)
    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot|jpg|jpeg|gif|png|webp|avif|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Адрес php берётся у DNS Docker при каждом запросе, а не один раз при
    # старте: иначе после пересборки контейнера php nginx отдаёт 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ \.php$ {
        include fastcgi.conf;
        set $php_upstream php:9000;
        fastcgi_pass $php_upstream;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.ht {
        deny all;
    }
}
