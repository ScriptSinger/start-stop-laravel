services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - laravel

  php:
    build:
      context: .
      dockerfile: docker/php/php.dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/var/www/html
      - ./docker/php/php-overrides.ini:/usr/local/etc/php/conf.d/php-overrides.ini
    depends_on:
      - db
    networks:
      - laravel

  # Планировщик Laravel (routes/console.php): каждую минуту schedule:run —
  # например, ночная пересборка public/sitemap.xml. Как в fridge-service.
  scheduler:
    build:
      context: .
      dockerfile: docker/php/php.dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ./docker/php/php-overrides.ini:/usr/local/etc/php/conf.d/php-overrides.ini
    depends_on:
      - db
    networks:
      - laravel

  composer:
    build:
      context: .
      dockerfile: docker/composer/composer.dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    networks:
      - laravel
    profiles:
      - tools

  # Сборка фронтенда (Vite): одинаковая на любой машине и на сервере.
  #   docker compose run --rm node npm ci
  #   docker compose run --rm node npm run build
  #   docker compose run --rm --service-ports node npm run dev
  node:
    image: node:22-alpine
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      npm_config_cache: /tmp/.npm
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    ports:
      - "5173:5173"
    networks:
      - laravel
    profiles:
      - tools

  # MariaDB (не MySQL, как в fridge-service) — осознанно: legacy-дамп старого
  # проекта (ocStore) создан под MariaDB 10.5, уже проверен на совместимость.
  db:
    image: mariadb:10.5
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      # Разовый импорт БД старого проекта во вторую схему `legacy` при первом старте
      - ./docker/init-db/01-legacy.sh:/docker-entrypoint-initdb.d/01-legacy.sh:ro
      - ${LEGACY_DUMP_PATH:-/home/archivarius/app/start-stop/dump.sql}:/legacy-dump.sql:ro
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - laravel

volumes:
  db_data:

networks:
  laravel:
    driver: bridge
