<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-labelledby="t" font-family="Arial, Helvetica, sans-serif">
<title id="t">Как читать этикетку аккумулятора: напряжение, ёмкость, пусковой ток, полярность, технология</title>
<rect width="840" height="420" rx="14" fill="#f6f7f9"/>
<!-- корпус и клеммы -->
<rect x="30" y="50" width="470" height="320" rx="12" fill="#2b2f36"/>
<rect x="70" y="30" width="60" height="26" rx="5" fill="#2b2f36"/>
<rect x="400" y="30" width="60" height="26" rx="5" fill="#2b2f36"/>
<!-- этикетка -->
<rect x="52" y="74" width="426" height="272" rx="8" fill="#fff"/>
<path d="M52 82a8 8 0 0 1 8-8h410a8 8 0 0 1 8 8v34H52z" fill="#c82a00"/>
<text x="72" y="103" font-size="22" font-weight="700" fill="#fff">АККУМУЛЯТОР</text>
<text x="458" y="103" text-anchor="end" font-size="20" font-weight="700" fill="#fff">EFB</text>
<text x="72" y="172" font-size="40" font-weight="700" fill="#222">12V</text>
<text x="190" y="172" font-size="40" font-weight="700" fill="#222">60Ah</text>
<text x="72" y="228" font-size="30" font-weight="700" fill="#222">EN 540A</text>
<text x="72" y="264" font-size="16" fill="#555">242 × 175 × 190 мм</text>
<text x="72" y="326" font-size="13" fill="#888">Пример: у разных производителей поля расположены по-разному</text>
<!-- схема полярности на этикетке -->
<rect x="328" y="190" width="132" height="64" rx="6" fill="#fff" stroke="#333" stroke-width="3"/>
<circle cx="360" cy="222" r="14" fill="#1f5fbf"/>
<text x="360" y="230" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">−</text>
<circle cx="428" cy="222" r="14" fill="#c82a00"/>
<text x="428" y="230" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">+</text>
<!-- номера на этикетке -->
<g font-size="14" font-weight="700" text-anchor="middle" fill="#fff">
<circle cx="52" cy="158" r="13" fill="#1776c9"/><text x="52" y="163">1</text>
<circle cx="182" cy="140" r="13" fill="#1776c9"/><text x="182" y="145">2</text>
<circle cx="52" cy="214" r="13" fill="#1776c9"/><text x="52" y="219">3</text>
<circle cx="476" cy="206" r="13" fill="#1776c9"/><text x="476" y="211">4</text>
<circle cx="478" cy="74" r="13" fill="#1776c9"/><text x="478" y="79">5</text>
</g>
<!-- расшифровка -->
<g font-size="17" fill="#222">
<g font-weight="700" font-size="15" text-anchor="middle" fill="#fff">
<circle cx="560" cy="130" r="13" fill="#1776c9"/><text x="560" y="135">1</text>
<circle cx="560" cy="184" r="13" fill="#1776c9"/><text x="560" y="189">2</text>
<circle cx="560" cy="238" r="13" fill="#1776c9"/><text x="560" y="243">3</text>
<circle cx="560" cy="292" r="13" fill="#1776c9"/><text x="560" y="297">4</text>
<circle cx="560" cy="346" r="13" fill="#1776c9"/><text x="560" y="351">5</text>
</g>
<text x="584" y="136"><tspan font-weight="700">Напряжение</tspan>, В</text>
<text x="584" y="190"><tspan font-weight="700">Ёмкость</tspan>, Ah</text>
<text x="584" y="244"><tspan font-weight="700">Пусковой ток</tspan> по EN, А</text>
<text x="584" y="298"><tspan font-weight="700">Полярность</tspan> (схема)</text>
<text x="584" y="352"><tspan font-weight="700">Технология</tspan> (EFB, AGM…)</text>
</g>
</svg>
