<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="t" font-family="Arial, Helvetica, sans-serif">
<title id="t">Три типа клемм аккумулятора: стандартные, тонкие и боковые</title>
<rect width="840" height="360" rx="14" fill="#f6f7f9"/>
<g text-anchor="middle">
<!-- A: стандартные -->
<text x="140" y="38" font-size="18" font-weight="700" fill="#222">Стандартные</text>
<text x="140" y="60" font-size="14" fill="#6b6b6b">толстые конусные клеммы</text>
<rect x="30" y="100" width="220" height="130" rx="10" fill="#fff" stroke="#333" stroke-width="3"/>
<circle cx="80" cy="150" r="30" fill="#1f5fbf"/><circle cx="80" cy="150" r="13" fill="#fff" opacity=".35"/>
<text x="80" y="160" font-size="34" font-weight="700" fill="#fff">−</text>
<circle cx="200" cy="150" r="34" fill="#c82a00"/><circle cx="200" cy="150" r="15" fill="#fff" opacity=".35"/>
<text x="200" y="162" font-size="38" font-weight="700" fill="#fff">+</text>
<text x="140" y="262" font-size="13" fill="#6b6b6b">вид сверху</text>
<!-- B: тонкие -->
<text x="420" y="38" font-size="18" font-weight="700" fill="#222">Тонкие («Asia»)</text>
<text x="420" y="60" font-size="14" fill="#6b6b6b">клеммы заметно тоньше</text>
<rect x="310" y="100" width="220" height="130" rx="10" fill="#fff" stroke="#333" stroke-width="3"/>
<circle cx="360" cy="150" r="18" fill="#1f5fbf"/><circle cx="360" cy="150" r="7" fill="#fff" opacity=".35"/>
<text x="360" y="158" font-size="24" font-weight="700" fill="#fff">−</text>
<circle cx="480" cy="150" r="20" fill="#c82a00"/><circle cx="480" cy="150" r="8" fill="#fff" opacity=".35"/>
<text x="480" y="159" font-size="26" font-weight="700" fill="#fff">+</text>
<text x="420" y="262" font-size="13" fill="#6b6b6b">вид сверху</text>
<!-- C: боковые -->
<text x="700" y="38" font-size="18" font-weight="700" fill="#222">Боковые</text>
<text x="700" y="60" font-size="14" fill="#6b6b6b">крепление под болт сбоку</text>
<rect x="590" y="100" width="220" height="130" rx="10" fill="#fff" stroke="#333" stroke-width="3"/>
<rect x="590" y="100" width="220" height="30" rx="10" fill="#e6e6e6" stroke="#333" stroke-width="3"/>
<circle cx="636" cy="196" r="19" fill="#fff" stroke="#1f5fbf" stroke-width="5"/><circle cx="636" cy="196" r="8" fill="#1f5fbf"/>
<circle cx="764" cy="196" r="19" fill="#fff" stroke="#c82a00" stroke-width="5"/><circle cx="764" cy="196" r="8" fill="#c82a00"/>
<text x="636" y="172" font-size="22" font-weight="700" fill="#1f5fbf">−</text>
<text x="764" y="172" font-size="22" font-weight="700" fill="#c82a00">+</text>
<text x="700" y="262" font-size="13" fill="#6b6b6b">вид сбоку</text>
</g>
<text x="420" y="320" text-anchor="middle" font-size="15" fill="#444">Схема без масштаба: подходит ли тип, лучше сверить по старому аккумулятору</text>
</svg>
