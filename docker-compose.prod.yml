# Продакшен (сервер, папка ~/start-stop). Выкладывает .github/workflows/deploy.yml:
#   docker compose -f docker-compose.prod.yml up -d --build
# Наружу смотрит только Traefik (общая сеть proxy): у сервисов нет ports.
services:
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # APP_DOMAIN — пока IP сервера (самоподписанный сертификат), потом
      # start-stop.su — и Let's Encrypt выдаст настоящий.
      - traefik.http.routers.start-stop.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.start-stop.entrypoints=websecure
      - traefik.http.routers.start-stop.tls=true
      - traefik.http.routers.start-stop.tls.certresolver=le

  php:
    build:
      context: .
      dockerfile: docker/php/php.dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ./docker/php/php-overrides.ini:/usr/local/etc/php/conf.d/php-overrides.ini
    depends_on:
      - db
      - redis
    networks:
      - internal

  # Планировщик: бэкап базы, sitemap, посадочные страницы (routes/console.php).
  scheduler:
    build:
      context: .
      dockerfile: docker/php/php.dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ./docker/php/php-overrides.ini:/usr/local/etc/php/conf.d/php-overrides.ini
    depends_on:
      - db
      - redis
    networks:
      - internal

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal

  # Письма (восстановление пароля). Для доставки во «Входящие» у домена
  # нужна SPF-запись с IP сервера.
  mailrelay:
    image: boky/postfix:latest
    restart: unless-stopped
    environment:
      ALLOWED_SENDER_DOMAINS: ${MAIL_RELAY_ALLOWED_DOMAINS:-start-stop.su}
      POSTFIX_myhostname: ${MAIL_RELAY_HOSTNAME:-start-stop.su}
    networks:
      - internal

volumes:
  db_data:
  redis_data:

networks:
  proxy:
    external: true
  internal:
