name: Deploy to Server

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Deployment Script
        run: |
          bash -n docker/deploy.sh
          python3 tests/deploy_test.py

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, zip, gd, pdo, sqlite3, curl, openssl
          tools: composer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --optimize-autoloader --no-interaction

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: npm run build

      - name: Run Tests
        run: |
          cp .env.example .env
          php artisan test

      - name: Install Production Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Create Release Archive
        run: |
          tar -czf release.tar.gz \
            app \
            bootstrap \
            config \
            database \
            docker \
            lang \
            public \
            resources \
            routes \
            vendor \
            artisan \
            composer.json \
            composer.lock \
            docker-compose.prod.yml

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: release
          path: .

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      # .env пишется здесь и копируется файлом: так спецсимволы в паролях
      # ($, кавычки) доходят как есть, а не разбираются shell на сервере.
      - name: Upload Release to Server
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          umask 077
          printf '%s\n' "$ENV_FILE" > production.env
          scp -i ~/.ssh/id_ed25519 release.tar.gz \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/start-stop-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          scp -i ~/.ssh/id_ed25519 production.env \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/start-stop-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.config"

      - name: Deploy on Server
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash -s -- "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" << 'EOF'
            set -e
            case "$1:$2" in *[!0-9:]*|:*) exit 1 ;; esac
            cd ~/start-stop
            archive="/tmp/start-stop-$1-$2.tar.gz"
            configuration="/tmp/start-stop-$1-$2.config"
            # Run the deployment script shipped with the tested artifact.
            script=$(mktemp /tmp/start-stop-deploy-XXXXXXXX.sh)
            trap 'rm -f "$script" "$archive" "$configuration"' EXIT
            tar -xOf "$archive" docker/deploy.sh > "$script"
            bash "$script" "$archive" "$configuration"
          EOF
